<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programa Trade-In | GX STORE ECUADOR</title>
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
  <link rel="stylesheet" href="css/styles.css?v=17">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-body);">

  <div class="tradein-wrapper" style="width: 100%; max-width: 500px; padding: 1.5rem;">
    <a href="index.html" style="display: inline-block; color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; margin-bottom: 2rem; transition: color 0.2s;">
      &larr; Volver al Catálogo
    </a>

    <div class="admin-card" style="margin-bottom: 0;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.8rem; font-weight: 900; margin-bottom: 0.5rem;"><span style="color: var(--accent-green);">GX</span> Trade-In</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">Vende tu equipo actual o dalo como parte de pago para llevarte uno mejor.</p>
      </div>

      <form id="tradeInForm" style="display: flex; flex-direction: column; gap: 1.2rem;">
        
        <div class="form-group">
          <label for="tipoOperacion">¿Qué deseas hacer?</label>
          <select id="tipoOperacion" class="input-control" required>
            <option value="Dar como parte de pago para uno nuevo">Dar como parte de pago para uno nuevo</option>
            <option value="Vender mi equipo en efectivo">Vender mi equipo en efectivo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="marcaModelo">Marca y Modelo Exacto</label>
          <input type="text" id="marcaModelo" class="input-control" placeholder="Ej: iPhone 13 Pro Max" required>
        </div>

        <div class="form-grid" style="margin-bottom: 0;">
          <div class="form-group">
            <label for="capacidad">Capacidad</label>
            <input type="text" id="capacidad" class="input-control" placeholder="Ej: 256GB" required>
          </div>
          <div class="form-group">
            <label for="bateria">Salud de Batería</label>
            <input type="text" id="bateria" class="input-control" placeholder="Ej: 89%" required>
          </div>
        </div>

        <div class="form-group">
          <label for="tiempoUso">Tiempo de uso aproximado</label>
          <input type="text" id="tiempoUso" class="input-control" placeholder="Ej: 8 meses / 1 año" required>
        </div>

        <div class="form-group">
          <label for="detalles">Estado físico y detalles</label>
          <textarea id="detalles" class="input-control" rows="3" placeholder="Ej: Pantalla impecable, pequeño rayón en la parte trasera. Sin caja." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 1rem; padding: 1rem; font-size: 1.05rem;">
          Enviar a GX Store (WhatsApp)
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="margin-left: 5px;">
            <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.23 8.23 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m4.52 11.66c-.19.53-1.09 1.04-1.54 1.1-.42.06-.97.09-2.79-.66-2.33-.96-3.83-3.34-3.95-3.5-.12-.15-.95-1.26-.95-2.4 0-1.15.6-1.71.82-1.94.21-.23.47-.29.62-.29.16 0 .31.01.45.01.14 0 .34-.05.53.4.19.46.66 1.6.72 1.72.06.12.1.26.02.42-.08.16-.12.26-.24.4-.12.14-.25.31-.36.42-.12.12-.24.25-.1.5.14.24.62 1.02 1.33 1.65.91.81 1.68 1.06 1.92 1.18.24.12.38.1.52-.06.14-.16.6-.7.76-.94.16-.24.32-.2.53-.12.21.08 1.33.63 1.56.74.23.12.38.17.44.27.06.1.06.58-.13 1.11z"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('tradeInForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const tipo = document.getElementById('tipoOperacion').value;
      const modelo = document.getElementById('marcaModelo').value;
      const capacidad = document.getElementById('capacidad').value;
      const bateria = document.getElementById('bateria').value;
      const tiempoUso = document.getElementById('tiempoUso').value;
      const detalles = document.getElementById('detalles').value;

      // Armar el mensaje para WhatsApp
      const mensaje = `Hola GX Store, me interesa el programa Trade-In.\n\n*Quiero:* ${tipo}\n*Equipo:* ${modelo}\n*Capacidad:* ${capacidad}\n*Salud Batería:* ${bateria}\n*Tiempo de Uso:* ${tiempoUso}\n*Detalles:* ${detalles}\n\n¿Me pueden ayudar con una pre-cotización?`;
      
      // Codificar el texto para la URL
      const mensajeCodificado = encodeURIComponent(mensaje);
      
      // Tu número de GX Store (593992641656)
      window.open(`https://wa.me/593992641656?text=${mensajeCodificado}`, '_blank');
    });
  </script>
</body>
</html>
